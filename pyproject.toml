[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nonprofit-comms-gateway"
version = "0.1.0"
description = "Preview donor receipts, volunteer reminders, and campaign reports through an OpenAI-compatible gateway."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.60,<2",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["nonprofit_comms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
